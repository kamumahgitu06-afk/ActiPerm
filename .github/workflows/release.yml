name: Build & Release ActiPerm APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish Release v1.0 with app-debug.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: ActiPerm v1.0 (Package Manager Pro)
          body: |
            Rilis resmi **ActiPerm v1.0 - Package Manager Pro**.
            - Audit izin aplikasi (`QUERY_ALL_PACKAGES`), skor risiko 0–100, whitelist pintar & deteksi Pinjol/Getcontact.
            - Manajemen izin PRO via Shizuku, ADB, dan Fallback Pengaturan Sistem.
            - Aksi massal anti-bootloop, riwayat persisten, ekspor laporan `.txt`, dan tombol Saweria.
            - Kompatibel Android 7.0 Nougat (`minSdk = 24`) hingga Android 16 (`targetSdk = 36`).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
