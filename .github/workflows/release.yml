name: Build & Release ActiPerm APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          sudo chown -R "$(whoami)":"$(id -gn)" "$SDK_DIR" 2>/dev/null || true
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publish Release v1.0 with app-debug.apk
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0
          name: ActiPerm v1.0 (Package Manager Pro)
          body: |
            Rilis resmi **ActiPerm v1.0 - Package Manager Pro**.
            - Audit izin aplikasi (`QUERY_ALL_PACKAGES`), skor risiko 0–100, whitelist pintar & deteksi Pinjol/Getcontact.
            - Manajemen izin PRO via Shizuku, ADB, dan Fallback Pengaturan Sistem.
            - Aksi massal anti-bootloop, riwayat persisten, ekspor laporan `.txt`, dan tombol Saweria.
            - Kompatibel Android 7.0 Nougat (`minSdk = 24`) hingga Android 16 (`targetSdk = 36`).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
